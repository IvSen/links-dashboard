user nginx;
worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

stream {
    map $ssl_preread_server_name $tls_upstream {
        ~\.local\.rf-tech\.ru$  127.0.0.1:443;
        default                 127.0.0.1:8443;
    }

    server {
        listen 10443;
        ssl_preread on;
        proxy_pass $tls_upstream;
        proxy_connect_timeout 5s;
        proxy_timeout 600s;
    }
}

http {
    access_log off;

    map $host $http_upstream {
        beszel.test             127.0.0.1:8095;
        netdata.test            127.0.0.1:19999;
        ~\.local\.rf-tech\.ru$  127.0.0.1:80;
        default                 127.0.0.1:8080;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 10080 default_server;
        client_max_body_size 0;

        location / {
            proxy_pass http://$http_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 600s;
            proxy_buffering off;
        }
    }
}
