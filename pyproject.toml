[project]
name = "links-dashboard"
version = "0.1.0"
description = "Dashboard of dev links of a remote Docker host"
readme = "README.md"
authors = [
    { name = "IvSen", email = "ivan.senishin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docker>=7.2.0",
    "fastapi>=0.148.0",
    "httpx>=0.28.1",
    "kubernetes>=37.0.1",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "trustme>=1.2.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
